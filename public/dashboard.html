<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function inr(n){return "₹"+Number(n).toLocaleString("en-IN");}
function dt(ms){return new Date(ms).toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",year:"numeric"});}
function kb(n){return n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function api(a,d){return fetch("/api/account",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action:a},d||{}))}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,status:r.status,j:j};});});}
var S=null, flash=null, busy=false;
var TYPES=["Salon / Beauty","Cafe / Restaurant / Food","Clothing / Boutique","Gym / Fitness","Clinic / Health","Education / Coaching","Real estate","Jewellery","Home decor / Furniture","Services / Agency","Other"];
var FOLL=["Under 500","500 - 2,000","2,000 - 10,000","10,000 - 50,000","50,000+"];
var GOALS=["Get more customers / enquiries","Get more followers","Sell products online","Build my brand","Get more walk-ins"];
function opts(list,cur){var l=list.slice();if(cur&&l.indexOf(cur)<0)l.push(cur);return '<option value="">Choose one</option>'+l.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>';}).join("");}
function logout(){api("logout").then(function(){location.replace("/login");});}
document.addEventListener("click",function(e){if(e.target&&e.target.id==="logoutBtn")logout();});

function load(){return api("me").then(function(x){
  if(x.status===401){location.replace("/login");return;}
  if(!x.ok){$("app").innerHTML='<div class="banner bad">'+esc((x.j&&x.j.error)||"Could not load your dashboard.")+' <button class="linkbtn" onclick="location.reload()">Try again</button></div>';return;}
  S=x.j;render();
}).catch(function(){$("app").innerHTML='<div class="banner bad">No connection. <button class="linkbtn" onclick="location.reload()">Try again</button></div>';});}

function calc(months,bump){
  var P=S.prices, sub=(months===3?P.pack3:P.renew)+(bump?P.bump:0), best=null, amt=0;
  if(S.offers.credit){var a=Math.round(sub*P.pct/100);if(a>amt){amt=a;best="credit";}}
  if(S.offers.winback){var w=P.winbackOff;if(w>amt){amt=w;best="winback";}}
  return {sub:sub,disc:amt,kind:best,total:sub-amt};
}
var RM=1;
function priceLine(q){
  if(!q.disc) return "";
  return (q.kind==="winback"?"Welcome-back discount":"Referral credit (10% off)")+": <b>−"+inr(q.disc)+"</b>";
}
function planCard(){
  var m=S.membership;
  if(!m) return '<div class="card"><h2>Your plan</h2><p class="empty">We could not find an active plan on this email.</p></div>';
  var label={active:"Active",ending:"Ending soon",expired:"Ended"}[m.status];
  var used=Math.min(100,Math.max(0,(Date.now()-m.periodStart)/(m.periodEnd-m.periodStart)*100));
  var left=m.status==="expired"?0:100-used;
  var big=m.status==="expired"?'Plan ended <small>on '+dt(m.expiresAt)+'</small>':m.daysLeft+' <small>day'+(m.daysLeft===1?'':'s')+' left &middot; ends '+dt(m.expiresAt)+'</small>';
  var note=m.status==="ending"?'<div class="banner warn">Your plan ends soon. Renew now to get next month’s calendar without a gap.</div>':
           m.status==="expired"?'<div class="banner bad">Your plan has ended. Renew to get a fresh 30-day calendar and an updated report.</div>':"";
  var offer="";
  if(S.offers.winback) offer+='<div class="banner good">Welcome-back offer: <b>'+inr(S.prices.winbackOff)+' off</b> your renewal until '+dt(S.offers.winback.until)+'. It is applied automatically.</div>';
  if(S.offers.credit) offer+='<div class="banner good">You have a <b>'+S.prices.pct+'% referral credit</b>. It is applied automatically when you renew.</div>';
  var pack=m.packMonths>1?'<span class="chip none" style="margin-left:6px">Month '+m.periodNo+' of '+m.packMonths+'</span>':"";
  var q=calc(RM,false);
  return '<div class="card"><div class="top2"><h2 style="margin:0">Your plan</h2><span><span class="chip '+m.status+'">'+label+'</span>'+pack+'</span></div>'+
    '<div class="big">'+big+'</div><div class="bar" role="img" aria-label="Time left in this month"><i style="width:'+left.toFixed(1)+'%"></i></div>'+note+offer+
    '<div class="packs2" role="radiogroup" aria-label="Choose how long to renew for">'+
      '<label class="pk'+(RM===1?' on':'')+'" for="pm1"><input type="radio" name="pm" id="pm1" value="1"'+(RM===1?' checked':'')+'><div><b>1 month</b><span>'+inr(S.prices.renew)+'</span></div></label>'+
      '<label class="pk'+(RM===3?' on':'')+'" for="pm3"><input type="radio" name="pm" id="pm3" value="3"'+(RM===3?' checked':'')+'><div><b>3 months</b><span>'+inr(S.prices.pack3)+' <i>save '+inr(3*S.prices.renew-S.prices.pack3)+'</i></span></div></label>'+
    '</div>'+
    '<label class="check" for="bump"><input type="checkbox" id="bump"><div><b>Add 10 reel scripts for '+inr(S.prices.bump)+' more</b><span>Word-for-word scripts for your next month.</span></div></label>'+
    '<div class="fine" id="priceLine" style="text-align:left">'+priceLine(q)+'</div>'+
    '<button class="btn full" id="renewBtn" type="button">Renew for '+inr(q.total)+'</button>'+
    '<p class="fine">No automatic charge, you only pay when you tap Renew. Renewing early never wastes days: your new days start when this plan ends.</p>'+
    '<div class="msgline" id="renewMsg" role="status" aria-live="polite"></div></div>';
}
var DAYMS=86400000, ALLDAYS=false;
function dayLabel(ms){return new Date(ms).toLocaleDateString("en-IN",{timeZone:"Asia/Kolkata",weekday:"short",day:"numeric",month:"short"});}
function calCard(){
  var c=S.calendar; if(!c) return "";
  var done=c.ticks.length, today=Math.min(30,Math.max(1,Math.floor((Date.now()-c.startMs)/DAYMS)+1));
  var from=ALLDAYS?1:Math.max(1,Math.min(today,24)), to=ALLDAYS?30:Math.min(30,from+6), rows="";
  for(var n=from;n<=to;n++){
    var on=c.ticks.indexOf(n)>=0, idea=c.ideas[n-1];
    rows+='<label class="crow'+(on?' done':'')+(n===today?' today':'')+'" for="cd'+n+'"><input type="checkbox" id="cd'+n+'" data-day="'+n+'"'+(on?' checked':'')+'><span class="cd"><b>Day '+n+'</b> '+(n===today?'<em>today</em> ':'')+'<small>'+dayLabel(c.startMs+(n-1)*DAYMS)+'</small>'+(idea?'<span class="idea">'+esc(idea)+'</span>':'')+'</span></label>';
  }
  var noIdeas=!c.ideas.length?'<p class="fine" style="text-align:left;margin:0 0 8px">Your day-by-day ideas are in your report above. Tick each day once you have posted.</p>':"";
  return '<div class="card"><div class="top2"><h2 style="margin:0">Your posting tracker</h2>'+(c.packMonths>1?'<span class="chip none">Month '+c.periodNo+' of '+c.packMonths+'</span>':'')+'</div>'+
    '<p class="sub" style="margin-top:4px">Tick a day when you have posted. Small streaks add up.</p>'+
    '<div class="big" style="font-size:2rem;margin:6px 0 10px" id="calCount">'+done+' <small>of 30 days posted</small></div>'+
    '<div class="bar" aria-hidden="true"><i id="calBar" style="width:'+(done/30*100).toFixed(1)+'%"></i></div>'+noIdeas+
    '<div class="crows" id="crows">'+rows+'</div>'+
    '<button class="linkbtn" id="calAll" type="button" style="margin-top:12px">'+(ALLDAYS?'Show only this week':'Show all 30 days')+'</button><div class="msgline" id="calMsg" role="status" aria-live="polite"></div></div>';
}
function refCard(){
  var r=S.referral;
  var text="I use Vigyapan Studio for my Instagram growth plan. Use my code "+r.code+" for 10% off your first order: "+r.link;
  return '<div class="card"><h2>Share and save</h2><p class="sub">Friends who use your code get <b>'+S.prices.pct+'% off</b> their first order. When they pay, you get <b>'+S.prices.pct+'% off</b> your next renewal.</p>'+
    '<div class="refbox"><code id="refCode">'+esc(r.code)+'</code><button class="btn alt sm" id="copyRef" type="button">Copy code</button></div>'+
    '<a class="btn wa sm" style="margin-top:12px" href="https://wa.me/?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">Share on WhatsApp</a>'+
    '<p class="fine" style="text-align:left">Friends who joined: <b>'+r.friends+'</b> &middot; Credits waiting: <b>'+r.credits+'</b></p><div class="msgline" id="refMsg" role="status" aria-live="polite"></div></div>';
}
var RS=0;
function reviewCard(){
  if(!S.canReview) return "";
  var rv=S.review, cur=RS||(rv?rv.rating:0), st="";
  for(var i=1;i<=5;i++) st+='<button type="button" class="star'+(i<=cur?' on':'')+'" data-star="'+i+'" aria-label="'+i+' star'+(i>1?'s':'')+'">★</button>';
  var status=rv?(rv.publish?(rv.approved?'Thank you! Your review is showing on our website.':'Thank you! Your review is saved and waiting for our approval before it shows on the website.'):'Thank you! Your feedback is saved. We will not show it publicly.'):"";
  var first=(S.customer.name||"").split(" ")[0];
  return '<div class="card" id="reviewCard"><h2>Share your feedback</h2><p class="sub">How is your plan going? An honest review helps us improve and helps other small businesses decide.</p>'+
    '<div class="stars" role="group" aria-label="Your rating">'+st+'</div>'+
    '<div class="f" style="margin-top:12px"><label for="rv_text" class="sr" style="position:absolute;left:-9999px">Your review</label><textarea id="rv_text" maxlength="600" placeholder="What changed for you? What did you like or not like?">'+esc(rv?rv.text:"")+'</textarea></div>'+
    '<div class="f" style="margin-top:10px"><label for="rv_name">Name to show <small>(first name and business are enough)</small></label><input id="rv_name" maxlength="40" value="'+esc(rv?rv.name:first)+'"></div>'+
    '<label class="check" for="rv_pub" style="margin-top:12px"><input type="checkbox" id="rv_pub"'+(rv&&rv.publish?' checked':'')+'><div><b>You may show my review on your website</b><span>With my name and business name. You can change this later.</span></div></label>'+
    '<button class="btn alt sm" id="rvSave" type="button" style="margin-top:12px">'+(rv?'Update feedback':'Send feedback')+'</button><div class="msgline '+(rv?'good':'')+'" id="rvMsg" role="status" aria-live="polite">'+status+'</div></div>';
}
function reportsCard(){
  var rows=S.deliveries.length?S.deliveries.map(function(d){
    return '<div class="row"><div><div class="t">'+esc(d.title)+'</div><div class="s">'+(d.month?esc(d.month)+' &middot; ':'')+kb(d.size)+' &middot; added '+dt(d.uploadedAt)+'</div></div><a class="btn sm" href="/api/download?id='+encodeURIComponent(d.id)+'">Download</a></div>';
  }).join(""):'<p class="empty">Your first report and calendar are being prepared. They will appear here, and we will also send them on WhatsApp or email, within 48 hours of payment.</p>';
  return '<div class="card"><h2>Your reports and calendars</h2><p class="sub">Every month’s report stays saved here.</p>'+rows+'</div>';
}
function focusCard(){
  return '<div class="card"><h2>What should we focus on next month?</h2><p class="sub">New offer, festival, product launch, a type of reel you want more of. We read this when we prepare your next calendar.</p>'+
    '<div class="f"><label class="sr" for="nextNote" style="position:absolute;left:-9999px">Next month focus</label><textarea id="nextNote" maxlength="600" placeholder="e.g. Diwali offer starts 20 Oct. Please include more reels showing before and after.">'+esc(S.customer.nextNote)+'</textarea></div>'+
    '<button class="btn alt sm" id="saveNote" type="button" style="margin-top:12px">Save note</button><div class="msgline" id="noteMsg" role="status" aria-live="polite"></div></div>';
}
function detailsCard(){
  var c=S.customer;
  return '<div class="card"><h2>Your details</h2><p class="sub">We use these to prepare your reports. Keep them up to date.</p>'+
   '<form id="detForm" novalidate><div class="grid2">'+
   '<div class="f"><label for="d_name">Your name</label><input id="d_name" value="'+esc(c.name)+'" autocomplete="name"></div>'+
   '<div class="f"><label for="d_ig">Instagram handle</label><div class="at"><span>@</span><input id="d_ig" value="'+esc(c.ig)+'" autocapitalize="none"></div></div>'+
   '<div class="f"><label for="d_biz">Business name</label><input id="d_biz" value="'+esc(c.biz)+'"></div>'+
   '<div class="f"><label for="d_type">Business type</label><select id="d_type">'+opts(TYPES,c.type)+'</select></div>'+
   '<div class="f"><label for="d_city">City</label><input id="d_city" value="'+esc(c.city)+'"></div>'+
   '<div class="f"><label for="d_foll">Followers right now</label><select id="d_foll">'+opts(FOLL,c.followers)+'</select></div>'+
   '<div class="f full"><label for="d_goal">Main goal on Instagram</label><select id="d_goal">'+opts(GOALS,c.goal)+'</select></div>'+
   '<div class="f full"><label for="d_comp">Competitor handles <small>(optional)</small></label><textarea id="d_comp" placeholder="@competitor1, @competitor2, @competitor3">'+esc(c.comp)+'</textarea></div>'+
   '<div class="f full"><label for="d_about">What product do you sell or what services do you offer?</label><textarea id="d_about">'+esc(c.about)+'</textarea></div>'+
   '</div><p class="fine">Login email: '+esc(c.email)+' &middot; WhatsApp: +91 '+esc(c.phone)+' (to change these, message us)</p>'+
   '<button class="btn alt sm" id="saveDet" type="submit" style="margin-top:12px">Save details</button><div class="msgline" id="detMsg" role="status" aria-live="polite"></div></form></div>';
}
function payCard(){
  var rows=S.payments.map(function(p){
    return '<div class="row"><div><div class="t">'+esc(p.invoiceNo)+' &middot; '+inr(p.amount)+'</div><div class="s">'+dt(p.paidAt)+(p.renewal?' &middot; renewal':' &middot; first order')+(p.bump?' &middot; with reel scripts':'')+'</div></div><a class="btn alt sm" href="/api/invoice?pid='+encodeURIComponent(p.paymentId)+'" target="_blank" rel="noopener">View invoice</a></div>';
  }).join("")||'<p class="empty">No payments yet.</p>';
  return '<div class="card"><h2>Payments and invoices</h2><p class="sub">Open an invoice to print it or save it as a PDF.</p>'+rows+'</div>';
}
function helpCard(){
  var msg="Hi Vigyapan Studio, I need help with my account ("+S.customer.email+").";
  return '<div class="card"><h2>Need help?</h2><p class="sub">Questions about your report or calendar? Message us any time.</p><a class="btn wa sm" href="https://wa.me/'+esc(S.whatsapp)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">Chat on WhatsApp</a></div>';
}
function render(){
  var first=(S.customer.name||"").split(" ")[0]||"there";
  var fl=flash?'<div class="banner '+flash.kind+'" role="status">'+esc(flash.text)+'</div>':"";
  $("app").innerHTML='<div class="eyebrow">Your dashboard</div><h1>Hi '+esc(first)+'</h1><p style="margin:0">'+(S.customer.biz?esc(S.customer.biz)+' &middot; ':'')+'@'+esc(S.customer.ig)+'</p>'+fl+
    '<div class="stack">'+planCard()+reportsCard()+calCard()+focusCard()+refCard()+reviewCard()+detailsCard()+payCard()+helpCard()+'</div>';
  wire();
}
function setMsg(id,t,c){var m=$(id);if(m){m.textContent=t||"";m.className="msgline"+(c?" "+c:"");}}
function wire(){
  var bump=$("bump"),rb=$("renewBtn");
  function reprice(){var q=calc(RM,bump.checked);rb.textContent="Renew for "+inr(q.total);$("priceLine").innerHTML=priceLine(q);}
  if(bump)bump.addEventListener("change",reprice);
  Array.prototype.forEach.call(document.querySelectorAll('input[name="pm"]'),function(r){r.addEventListener("change",function(){
    RM=+document.querySelector('input[name="pm"]:checked').value;
    Array.prototype.forEach.call(document.querySelectorAll(".pk"),function(p){p.classList.toggle("on",p.querySelector("input").checked);});
    reprice();});});
  if(rb)rb.addEventListener("click",renew);
  $("saveNote").addEventListener("click",function(){
    setMsg("noteMsg","Saving…");
    api("update",{nextNote:$("nextNote").value}).then(function(x){if(x.ok){S.customer.nextNote=$("nextNote").value;setMsg("noteMsg","Saved. Thank you!","good");}else setMsg("noteMsg",x.j.error||"Could not save.","bad");});
  });
  $("detForm").addEventListener("submit",function(e){
    e.preventDefault();setMsg("detMsg","Saving…");
    var p={name:$("d_name").value,ig:$("d_ig").value,biz:$("d_biz").value,type:$("d_type").value,city:$("d_city").value,followers:$("d_foll").value,goal:$("d_goal").value,comp:$("d_comp").value,about:$("d_about").value};
    api("update",{profile:p}).then(function(x){
      if(x.ok){setMsg("detMsg","Saved. Thank you!","good");}else setMsg("detMsg",x.j.error||"Could not save.","bad");
    });
  });
  // posting tracker
  var rows=$("crows");
  if(rows)rows.addEventListener("change",function(e){
    var cb=e.target;if(!cb||!cb.getAttribute("data-day"))return;
    var day=+cb.getAttribute("data-day"),on=cb.checked,c=S.calendar;
    var had=c.ticks.indexOf(day)>=0;
    if(on&&!had)c.ticks.push(day);if(!on&&had)c.ticks.splice(c.ticks.indexOf(day),1);
    cb.closest(".crow").classList.toggle("done",on);
    $("calCount").innerHTML=c.ticks.length+' <small>of 30 days posted</small>';$("calBar").style.width=(c.ticks.length/30*100).toFixed(1)+"%";
    api("tick",{day:day,done:on}).then(function(x){
      if(!x.ok){ // put it back
        cb.checked=!on;cb.closest(".crow").classList.toggle("done",!on);
        if(on&&c.ticks.indexOf(day)>=0)c.ticks.splice(c.ticks.indexOf(day),1);else if(!on&&c.ticks.indexOf(day)<0)c.ticks.push(day);
        $("calCount").innerHTML=c.ticks.length+' <small>of 30 days posted</small>';$("calBar").style.width=(c.ticks.length/30*100).toFixed(1)+"%";
        setMsg("calMsg",(x.j&&x.j.error)||"Could not save that tick. Please try again.","bad");
      } else setMsg("calMsg","");
    });
  });
  if($("calAll"))$("calAll").addEventListener("click",function(){ALLDAYS=!ALLDAYS;render();});
  // referral
  if($("copyRef"))$("copyRef").addEventListener("click",function(){
    var code=S.referral.code;
    function ok(){setMsg("refMsg","Code copied. Send it to a friend!","good");}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(ok,function(){setMsg("refMsg","Your code is "+code+". Select it and copy.");});}
    else setMsg("refMsg","Your code is "+code+". Select it and copy.");
  });
  // review
  Array.prototype.forEach.call(document.querySelectorAll(".star"),function(b){b.addEventListener("click",function(){
    RS=+b.getAttribute("data-star");Array.prototype.forEach.call(document.querySelectorAll(".star"),function(x){x.classList.toggle("on",+x.getAttribute("data-star")<=RS);});});});
  if($("rvSave"))$("rvSave").addEventListener("click",function(){
    var rating=RS||(S.review?S.review.rating:0);
    if(!rating){setMsg("rvMsg","Please tap the stars to rate.","bad");return;}
    var text=$("rv_text").value.trim();
    if(text.length<10){setMsg("rvMsg","Please write a sentence or two.","bad");return;}
    setMsg("rvMsg","Saving…");
    api("review",{rating:rating,text:text,name:$("rv_name").value,publish:$("rv_pub").checked}).then(function(x){
      if(x.ok){S.review={rating:rating,text:text,name:$("rv_name").value,publish:$("rv_pub").checked,approved:false};
        setMsg("rvMsg",S.review.publish?"Thank you! Your review is saved and waiting for our approval before it shows on the website.":"Thank you! Your feedback is saved. We will not show it publicly.","good");$("rvSave").textContent="Update feedback";}
      else setMsg("rvMsg",x.j.error||"Could not save.","bad");
    });
  });
}
var rzLoaded=null;
function loadRz(){
  if(window.Razorpay)return Promise.resolve();
  if(rzLoaded)return rzLoaded;
  rzLoaded=new Promise(function(res,rej){var s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=res;s.onerror=function(){rzLoaded=null;rej();};document.head.appendChild(s);});
  return rzLoaded;
}
function renew(){
  if(busy)return;busy=true;var rb=$("renewBtn");rb.disabled=true;setMsg("renewMsg","Opening secure payment…");
  var bump=$("bump").checked;
  Promise.all([api("renew",{bump:bump,months:RM}),loadRz()]).then(function(r){
    var x=r[0];
    if(!x.ok){throw new Error((x.j&&x.j.error)||"Could not start the payment.");}
    var o=x.j;
    var rz=new Razorpay({key:o.key,amount:o.amount,currency:"INR",order_id:o.orderId,name:"Vigyapan Studio",description:(RM===3?"3-month renewal":"Monthly renewal")+(bump?" + reel scripts":""),
      image:location.origin+"/assets/logo-icon.jpg",prefill:o.prefill,theme:{color:"#FFB72B"},
      modal:{ondismiss:function(){busy=false;rb.disabled=false;setMsg("renewMsg","Payment not completed. Tap Renew when you are ready.");}},
      handler:function(resp){paid(resp,o);}});
    rz.on("payment.failed",function(f){busy=false;rb.disabled=false;setMsg("renewMsg",((f&&f.error&&f.error.description)||"The payment did not go through.")+" Please try again.","bad");});
    setMsg("renewMsg","Complete your payment in the secure window.");
    rz.open();
  }).catch(function(err){busy=false;rb.disabled=false;setMsg("renewMsg",(err&&err.message)||"Could not open the payment window. Please try again.","bad");});
}
function paid(resp,o){
  setMsg("renewMsg","Payment received. Updating your plan…");
  var before=S.payments.length;
  fetch("/api/verify-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:o.orderId,paymentId:resp.razorpay_payment_id,signature:resp.razorpay_signature})})
    .then(function(r){return r.json();}).catch(function(){return {};})
    .then(function(){
      var tries=0;
      (function poll(){
        api("me").then(function(x){
          if(x.ok&&x.j.payments.length>before){S=x.j;busy=false;RM=1;flash={kind:"good",text:"Renewal received. Your plan now runs until "+dt(S.membership.expiresAt)+". Your invoice has been emailed to you."};render();window.scrollTo({top:0,behavior:"smooth"});}
          else if(++tries<6){setTimeout(poll,2500);}
          else{busy=false;flash={kind:"good",text:"Payment received. Your plan will update within a few minutes. Refresh this page shortly."};render();}
        });
      })();
    });
}
load();
})();
</script></body></html>
